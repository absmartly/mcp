name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Same gated e2e run as PR CI and npm-publish.yml; `publish` needs it.
  e2e:
    uses: ./.github/workflows/e2e.yml
    secrets:
      ABSMARTLY_API_KEY: ${{ secrets.ABSMARTLY_API_KEY }}
      ABSMARTLY_API_ENDPOINT: ${{ secrets.ABSMARTLY_API_ENDPOINT }}

  publish:
    needs: e2e
    env:
      REQUIRE_E2E: '1'
      ABSMARTLY_API_KEY: ${{ secrets.ABSMARTLY_API_KEY }}
      ABSMARTLY_API_ENDPOINT: ${{ secrets.ABSMARTLY_API_ENDPOINT }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Ensure DXT bundle stub for typecheck
        run: ./scripts/ensure-dxt-bundle.sh

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
