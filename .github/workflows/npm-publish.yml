name: Publish to npm

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # npm Trusted Publishing (OIDC) requires npm >= 11.5.1; Node 22's
      # bundled npm can be older, so upgrade before any npm command runs.
      - name: Update npm for trusted publishing support
        run: npm install -g npm@latest

      - name: Check if version changed
        id: version-check
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")

          set +e
          VIEW_OUTPUT=$(npm view @absmartly/mcp version 2>&1)
          VIEW_EXIT=$?
          set -e

          if [ $VIEW_EXIT -eq 0 ]; then
            PUBLISHED_VERSION="$VIEW_OUTPUT"
          elif echo "$VIEW_OUTPUT" | grep -q "E404"; then
            PUBLISHED_VERSION="none"
          else
            echo "npm view @absmartly/mcp failed for a reason other than 'not found':"
            echo "$VIEW_OUTPUT"
            exit 1
          fi

          echo "local=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED_VERSION" >> "$GITHUB_OUTPUT"

          if [ "$PUBLISHED_VERSION" = "none" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            # `sort -V` orders prereleases after their stable release (e.g.
            # treats 1.1.0-rc.1 as "greater than" 1.1.0), which is the
            # opposite of SemVer precedence and would publish a prerelease
            # under the `latest` dist-tag. Use node-semver's range matching
            # instead: LOCAL_VERSION only satisfies ">PUBLISHED_VERSION" when
            # it is a real SemVer-precedence increase.
            if npx --yes semver -r ">$PUBLISHED_VERSION" "$LOCAL_VERSION" > /dev/null 2>&1; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - run: npm ci
        if: steps.version-check.outputs.changed == 'true'

      # src/version.ts is a generated file, only regenerated by
      # scripts/sync-version.js (normally a pre-hook on build/dev/deploy).
      # This job never runs those, so without this step a manifest-only
      # version bump would publish a tarball whose local-server.ts still
      # advertises the old MCP_VERSION to MCP clients.
      - name: Sync src/version.ts to package.json version
        if: steps.version-check.outputs.changed == 'true'
        run: node scripts/sync-version.js

      - name: Ensure DXT bundle stub for typecheck
        if: steps.version-check.outputs.changed == 'true'
        run: ./scripts/ensure-dxt-bundle.sh

      - name: Typecheck
        if: steps.version-check.outputs.changed == 'true'
        run: npm run typecheck

      - name: Unit tests
        if: steps.version-check.outputs.changed == 'true'
        run: npm run test:unit

      - name: Publish to npm
        if: steps.version-check.outputs.changed == 'true'
        run: npm publish --access public
