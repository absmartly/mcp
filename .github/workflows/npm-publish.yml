name: Publish to npm

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # npm Trusted Publishing (OIDC) requires npm >= 11.5.1; Node 22's
      # bundled npm can be older, so upgrade before any npm command runs.
      - name: Update npm for trusted publishing support
        run: npm install -g npm@latest

      - name: Check if version changed
        id: version-check
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")

          VIEW_STDERR=$(mktemp)
          trap 'rm -f "$VIEW_STDERR"' EXIT
          set +e
          VIEW_OUTPUT=$(npm view @absmartly/mcp version --json 2>"$VIEW_STDERR")
          VIEW_EXIT=$?
          set -e

          if [ "$VIEW_EXIT" -eq 0 ]; then
            PUBLISHED_VERSION=$(printf '%s' "$VIEW_OUTPUT" | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const value = JSON.parse(input); const versions = Array.isArray(value) ? value : [value]; if (versions.length !== 1 || typeof versions[0] !== "string") process.exit(1); console.log(versions[0]); })')
          elif grep -q "E404" "$VIEW_STDERR"; then
            PUBLISHED_VERSION="none"
          else
            echo "npm view @absmartly/mcp failed for a reason other than 'not found':"
            cat "$VIEW_STDERR"
            exit 1
          fi

          echo "local=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED_VERSION" >> "$GITHUB_OUTPUT"

          if [ "$PUBLISHED_VERSION" = "none" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            # `sort -V` orders prereleases after their stable release (e.g.
            # treats 1.1.0-rc.1 as "greater than" 1.1.0), which is the
            # opposite of SemVer precedence and would publish a prerelease
            # under the `latest` dist-tag. Use node-semver's range matching
            # instead: LOCAL_VERSION only satisfies ">PUBLISHED_VERSION" when
            # it is a real SemVer-precedence increase.
            if npx --yes semver -r ">$PUBLISHED_VERSION" "$LOCAL_VERSION" > /dev/null 2>&1; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - run: npm ci
        if: steps.version-check.outputs.changed == 'true'

      # src/version.ts is a generated file, only regenerated by
      # scripts/sync-version.js (normally a pre-hook on build/dev/deploy).
      # This job never runs those, so without this step a manifest-only
      # version bump would publish a tarball whose local-server.ts still
      # advertises the old MCP_VERSION to MCP clients.
      - name: Sync src/version.ts to package.json version
        if: steps.version-check.outputs.changed == 'true'
        run: node scripts/sync-version.js

      - name: Ensure DXT bundle stub for typecheck
        if: steps.version-check.outputs.changed == 'true'
        run: ./scripts/ensure-dxt-bundle.sh

      - name: Typecheck
        if: steps.version-check.outputs.changed == 'true'
        run: npm run typecheck

      - name: Unit tests
        if: steps.version-check.outputs.changed == 'true'
        run: npm run test:unit

      # dist/ is gitignored and only produced by `tsc` — package.json's `main`,
      # `exports`, and `files` all point into it. Without this step the job
      # never compiles anything, so `npm publish` packs whatever `files` lists
      # from the checkout (bin/, src/, public/docs/) with an empty/missing
      # dist/, silently shipping a tarball that cannot be imported. (This is
      # exactly what happened with 1.2.0 — see fix/npm-publish-missing-dist.)
      - name: Build
        if: steps.version-check.outputs.changed == 'true'
        run: npm run build

      # Guard against this recurring for any future entry point: verify every
      # file package.json's `main`/`exports` map declares actually exists in
      # dist/ before we hand the tarball to npm.
      - name: Verify build output matches package.json entry points
        if: steps.version-check.outputs.changed == 'true'
        run: |
          node -e '
            const fs = require("fs");
            const pkg = require("./package.json");
            const paths = new Set();
            if (typeof pkg.main === "string") paths.add(pkg.main);
            if (typeof pkg.types === "string") paths.add(pkg.types);
            const collect = (val) => {
              if (typeof val === "string") { paths.add(val); return; }
              if (val && typeof val === "object") { for (const v of Object.values(val)) collect(v); }
            };
            collect(pkg.exports);
            const missing = [...paths].filter((p) => !fs.existsSync(p));
            if (missing.length > 0) {
              console.error("Missing build output declared in package.json:");
              for (const m of missing) console.error(`  - ${m}`);
              process.exit(1);
            }
            console.log(`Verified ${paths.size} entry point(s) exist in the build output.`);
          '

      - name: Publish to npm
        if: steps.version-check.outputs.changed == 'true'
        run: npm publish --access public
