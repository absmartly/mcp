name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Ensure DXT bundle stub for typecheck
        run: ./scripts/ensure-dxt-bundle.sh

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Endpoint manifest is current
        run: npm run manifest:check

      # executeCommand must dispatch as 2.0.1 did, apart from the listed
      # intentional differences (#66). The baseline is pinned to the 2.0.1
      # commit (scripts/parity-main.ts PARITY_BASELINE, printed by
      # --print-baseline), not main, so the gate stays meaningful after merge.
      - name: Dispatch parity with 2.0.1
        run: |
          git fetch --no-tags --depth=1 origin "$(npx tsx scripts/parity-main.ts --print-baseline)"
          npm run parity:main

      - name: Build (ESM + CommonJS)
        run: npm run build

      - name: Require the CommonJS entries
        run: node -e 'require("./dist/cjs/core.js"); require("./dist/cjs/oauth.js")'

      # The CommonJS entries require() the ESM-only @absmartly/cli, which needs
      # Node 22.12.0+ (unflagged require(esm)). Pin that boundary, since the
      # floating Node 22 above always passes.
      - name: Require the CommonJS entries on the minimum supported Node
        run: npx --yes --package=node@22.12.0 node -e 'require("./dist/cjs/core.js"); require("./dist/cjs/oauth.js")'

      - name: Type-check a Node16 CommonJS consumer
        run: npm run check:cjs-consumer
