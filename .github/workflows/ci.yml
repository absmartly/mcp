name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Ensure DXT bundle stub for typecheck
        run: ./scripts/ensure-dxt-bundle.sh

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Endpoint manifest is current
        run: npm run manifest:check

      - name: Build (ESM + CommonJS)
        run: npm run build

      - name: Require the CommonJS entries
        run: node -e 'require("./dist/cjs/core.js"); require("./dist/cjs/oauth.js")'
